server {
  listen 80;
  root /usr/share/nginx/html;

  # D63: a publicação de um patch minerado (rolatam-dm) traz o relatório inteiro no corpo (alguns MB).
  # Só esta rota aceita mais que o 1 MB padrão; a API confere o limite dela (24 MB) por cima.
  location /api/integracao/datamine/ {
    client_max_body_size 32m;
    proxy_pass http://host.docker.internal:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://host.docker.internal:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: rotas do Angular caem no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
