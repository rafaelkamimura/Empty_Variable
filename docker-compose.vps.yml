# VPS compartilhada: o nginx do host (TLS) encaminha uma sub-rota para o web (só em 127.0.0.1), que serve
# o Angular e repassa /api para a API. O banco é um Postgres que já roda na VPS, em outra stack.
# Uso: docker compose -f docker-compose.vps.yml up -d --build --wait   (lê o .env da raiz)
# Modelo do .env: .env.vps.example. Guia: docs/implantacao.md, seção 8.
name: emptyvariable-vps

services:
  # Nome longo de propósito: na rede do banco (de outra stack) o nome do serviço vira alias de DNS,
  # e um "api" ali se misturaria com o "api" de quem é dono da rede.
  emptyvariable-api:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # A senha precisa ser segura para URL (use: openssl rand -hex 24).
      DATABASE_URL: postgresql://${POSTGRES_USER:?defina no .env}:${POSTGRES_PASSWORD:?defina no .env}@${DB_HOST:?defina no .env}:${DB_PORT:-5432}/${POSTGRES_DB:?defina no .env}
      APP_ORIGIN: ${APP_ORIGIN:?defina no .env}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      SESSION_SECRET: ${SESSION_SECRET:?defina no .env}
      COOKIE_SECURE: "true"
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?defina no .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?defina no .env}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?defina no .env}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:?defina no .env}
      # Opcional: liga /api/integracao para outros sistemas (ex.: o bot nag4eyes).
      INTEGRACAO_TOKEN: ${INTEGRACAO_TOKEN:-}
      DIVINE_PRIDE_API_KEY: ${DIVINE_PRIDE_API_KEY:-}
      DIVINE_PRIDE_SERVER: ${DIVINE_PRIDE_SERVER:-LATAM}
      # D63: relatórios dos patches minerados (um subdiretório por patch), gravados no volume abaixo.
      DATAMINE_DIR: /dados/datamine
      # Login simulado nunca em produção (e a API também o recusa com NODE_ENV=production).
      AUTH_DEV_LOGIN: "false"
    volumes:
      - ${DATAMINE_DIR:-./datamine}:/dados/datamine
    networks:
      # O nginx do serviço web procura a API por "api", só na rede desta stack.
      default: { aliases: [api] }
      banco: {}

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        BASE_HREF: ${APP_BASE_PATH:-}/
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:80"
    depends_on:
      emptyvariable-api: { condition: service_healthy }

  emptyvariable-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/agendar.sh"]
    environment:
      PGHOST: ${DB_HOST}
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # Horário em UTC. Padrão: 07:00 UTC = 04:00 em Brasília.
      BACKUP_CRON: ${BACKUP_CRON:-0 7 * * *}
      BACKUP_RETENCAO: ${BACKUP_RETENCAO:-14}
    volumes:
      - ./database/backup:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    networks:
      - banco

networks:
  # Rede Docker da stack dona do Postgres (veja com: docker network ls).
  banco:
    external: true
    name: ${DB_NETWORK:?defina no .env}
