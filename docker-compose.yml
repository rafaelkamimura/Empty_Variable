# Ambiente de desenvolvimento/homologação local. Produção (Caddy + HTTPS + backup) vem na tarefa T-24.
name: emptyvariable

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      # O Compose local usa o Postgres desta stack. Use uma senha segura para URL.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: "3000"
      APP_ORIGIN: ${APP_ORIGIN:?defina no .env}
      SESSION_SECRET: ${SESSION_SECRET:?defina no .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      ADMIN_DISCORD_IDS: ${ADMIN_DISCORD_IDS:-}
      # Opcional: liga /api/integracao para outros sistemas (ex.: o bot nag4eyes).
      INTEGRACAO_TOKEN: ${INTEGRACAO_TOKEN:-}
      DIVINE_PRIDE_API_KEY: ${DIVINE_PRIDE_API_KEY:-}
      DIVINE_PRIDE_SERVER: ${DIVINE_PRIDE_SERVER:-LATAM}
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-false}
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:80"
    depends_on:
      - api

volumes:
  pgdata:
