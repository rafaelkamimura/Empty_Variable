name: CI

# Tudo roda nos runners self-hosted da VPS (a mesma máquina do deploy); nenhum runner da nuvem.
# Há mais de um runner: os dois jobs rodam em paralelo, e execuções de PRs diferentes também, então
# nada aqui pode usar porta, nome de container ou pasta fixos.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um CI por PR: um push novo cancela a execução do commit anterior. Na main, cada commit roda.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # PR que só mexe em documentação (Markdown fora de web/ e backend/) não precisa de build, testes
  # nem imagens: roda só a conferência de formatação. Na main e no disparo manual, roda tudo.
  alteracoes:
    name: o que mudou
    # Nunca executa código de fork na VPS. Como o workflow de um PR de fork vem do próprio fork,
    # o repositório também precisa exigir aprovação para rodar workflows de colaboradores externos.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, empty-variable]
    timeout-minutes: 5
    outputs:
      codigo: ${{ steps.diff.outputs.codigo }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TOPO: ${{ github.event.pull_request.head.sha }}
        run: |
          codigo=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if ! git diff --name-only "$BASE...$TOPO" | grep -qvE '(^docs/|\.md$|^\.github/(instructions/|pull_request_template\.md$)|^\.(claude|codex)/agents/)'; then
              codigo=false
            fi
          fi
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"

  verificar:
    name: lint, build, testes e e2e
    needs: alteracoes
    runs-on: [self-hosted, linux, empty-variable]
    timeout-minutes: 30
    env:
      CODIGO: ${{ needs.alteracoes.outputs.codigo }}
    steps:
      - uses: actions/checkout@v4
      # A VPS não tem Node no sistema: o setup-node baixa uma versão fixa para a execução.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @betel/api prisma:generate
        if: env.CODIGO == 'true'

      # A VPS não tem Google Chrome: os testes do Angular (Karma) e o e2e usam o Chromium do Playwright,
      # que fica em cache em ~/.cache/ms-playwright entre as execuções.
      - name: Chromium
        if: env.CODIGO == 'true'
        run: |
          pnpm --filter @betel/e2e exec playwright install chromium
          echo "CHROME_BIN=$(pnpm --filter @betel/e2e exec node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"

      # Postgres descartável, numa porta aleatória só em 127.0.0.1, um por execução. Dois bancos vazios:
      # os testes da API aplicam as migrations em um, o e2e no outro.
      - name: Subir o Postgres
        id: pg
        if: env.CODIGO == 'true'
        run: |
          nome="ev-ci-pg-${{ github.run_id }}-${{ github.run_attempt }}"
          senha="$(openssl rand -hex 16)"
          echo "::add-mask::$senha"
          docker run -d --rm --name "$nome" \
            -e POSTGRES_USER=betel -e POSTGRES_PASSWORD="$senha" -e POSTGRES_DB=betel_test \
            -p 127.0.0.1::5432 postgres:16-alpine
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 30); do
            docker exec "$nome" psql -U betel -d betel_test -qc "select 1" > /dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$nome" psql -U betel -d betel_test -v ON_ERROR_STOP=1 -qc "create database betel_e2e"
          porta=$(docker port "$nome" 5432/tcp | head -1 | awk -F: '{print $NF}')
          echo "url_testes=postgresql://betel:${senha}@127.0.0.1:${porta}/betel_test" >> "$GITHUB_OUTPUT"
          echo "url_e2e=postgresql://betel:${senha}@127.0.0.1:${porta}/betel_e2e" >> "$GITHUB_OUTPUT"

      - name: Formatação
        run: pnpm format:check
      - name: Lint
        if: env.CODIGO == 'true'
        run: pnpm lint
      - name: Build (motor primeiro, pois API e web dependem dele)
        if: env.CODIGO == 'true'
        run: |
          pnpm --filter @betel/scoring build
          pnpm -r --filter "!@betel/scoring" run build
      - run: pnpm typecheck
        if: env.CODIGO == 'true'
      - name: Testes (motor, API e web)
        if: env.CODIGO == 'true'
        run: pnpm test
        env:
          TEST_DATABASE_URL: ${{ steps.pg.outputs.url_testes }}
      # O e2e usa duas portas seguidas (web e API). Com mais de um runner na máquina, cada execução
      # escolhe um par livre em vez da porta padrão.
      - name: Testes e2e
        if: env.CODIGO == 'true'
        run: |
          E2E_PORTA=$(python3 -c 'import socket
          while True:
              a = socket.socket(); a.bind(("127.0.0.1", 0)); p = a.getsockname()[1]
              b = socket.socket()
              try:
                  b.bind(("127.0.0.1", p + 1)); print(p); break
              except OSError:
                  pass
              finally:
                  a.close(); b.close()')
          export E2E_PORTA
          pnpm e2e
        env:
          TEST_DATABASE_URL: ${{ steps.pg.outputs.url_e2e }}
          E2E_CANAL: chromium

      - name: Parar o Postgres
        if: always() && steps.pg.outputs.nome != ''
        run: docker rm -f "${{ steps.pg.outputs.nome }}" > /dev/null 2>&1 || true

  # Sobe as stacks de verdade, uma por vez, com nome de projeto e portas próprios da execução:
  # elas dividem o Docker da VPS com a produção e não podem encostar nela.
  docker:
    name: imagens e stacks (dev, Caddy e VPS)
    needs: alteracoes
    if: needs.alteracoes.outputs.codigo == 'true'
    runs-on: [self-hosted, linux, empty-variable]
    timeout-minutes: 30
    env:
      PROJETO: ev-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar portas e pasta de backup
        run: |
          porta() { python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])'; }
          {
            echo "PORTA_HTTP=$(porta)"
            echo "PORTA_HTTPS=$(porta)"
            echo "PORTA_WEB=$(porta)"
            echo "PASTA_BACKUP=$RUNNER_TEMP/$PROJETO-backups"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/$PROJETO-backups"

      - name: Imagens do ambiente local
        run: |
          cp .env.example .env
          SESSION_SECRET=segredo-local-apenas-para-validar-o-build docker compose -p "$PROJETO-dev" build

      # T-24: stack de produção com HTTPS local (Caddy usa CA interna para "localhost"),
      # backup e teste de restauração num banco temporário.
      - name: Stack com Caddy
        run: |
          sed -e 's/^DOMINIO=.*/DOMINIO=localhost/' \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^SESSION_SECRET=.*/SESSION_SECRET=$(openssl rand -hex 32)/" \
            -e 's/^DISCORD_CLIENT_ID=.*/DISCORD_CLIENT_ID=ci/' \
            -e 's/^DISCORD_CLIENT_SECRET=.*/DISCORD_CLIENT_SECRET=ci/' \
            -e 's/^DISCORD_GUILD_ID=.*/DISCORD_GUILD_ID=1/' \
            -e 's/^ADMIN_DISCORD_IDS=.*/ADMIN_DISCORD_IDS=1/' \
            -e "s#^BACKUP_DIR=.*#BACKUP_DIR=$PASTA_BACKUP#" \
            .env.producao.example > .env.producao
          {
            echo "CADDY_HTTP=127.0.0.1:$PORTA_HTTP"
            echo "CADDY_HTTPS=127.0.0.1:$PORTA_HTTPS"
          } >> .env.producao
          caddy=(docker compose -p "$PROJETO-caddy" -f docker-compose.prod.yml --env-file .env.producao)
          "${caddy[@]}" up -d --build --wait
          base="https://localhost:$PORTA_HTTPS"
          # O Caddy fica "healthy" antes de terminar de emitir o certificado local: espera o HTTPS responder.
          curl -fsSk --retry 10 --retry-delay 2 --retry-all-errors -o /dev/null "$base/api/saude"
          curl -fsSk "$base/api/saude" | grep '"status":"ok"'
          curl -fsSk "$base/" | grep '<app-root>'
          curl -fsSkI "$base/" | grep -i 'strict-transport-security'
          curl -sSk -o /dev/null -w '%{http_code}' "$base/api/auth/me" | grep 401
          "${caddy[@]}" exec -T backup sh /scripts/backup.sh
          "${caddy[@]}" exec -T backup sh /scripts/testar-restauracao.sh
      - name: Logs da stack com Caddy em caso de falha
        if: failure()
        run: docker compose -p "$PROJETO-caddy" -f docker-compose.prod.yml --env-file .env.producao logs --tail 200 || true
      - name: Derrubar a stack com Caddy
        if: always()
        run: |
          caddy=(docker compose -p "$PROJETO-caddy" -f docker-compose.prod.yml --env-file .env.producao)
          "${caddy[@]}" exec -T backup sh -c 'rm -rf /backups/*' || true
          "${caddy[@]}" down -v --rmi local --remove-orphans || true

      # A stack que roda de fato na VPS: sub-rota, sem Caddy, com o banco numa rede de outra stack.
      - name: Stack da VPS
        run: |
          docker network create "$PROJETO-banco"
          senha="$(openssl rand -hex 16)"
          docker run -d --name "$PROJETO-pg" --network "$PROJETO-banco" \
            -e POSTGRES_USER=emptyvariable -e POSTGRES_PASSWORD="$senha" -e POSTGRES_DB=emptyvariable \
            postgres:16-alpine
          cat > .env.vps <<EOF
          APP_ORIGIN=https://ci.exemplo.com
          APP_BASE_PATH=/emptyvariable
          WEB_PORT=$PORTA_WEB
          DB_HOST=$PROJETO-pg
          DB_NETWORK=$PROJETO-banco
          POSTGRES_DB=emptyvariable
          POSTGRES_USER=emptyvariable
          POSTGRES_PASSWORD=$senha
          SESSION_SECRET=$(openssl rand -hex 32)
          DISCORD_CLIENT_ID=ci
          DISCORD_CLIENT_SECRET=ci
          DISCORD_GUILD_ID=1
          ADMIN_DISCORD_IDS=1
          BACKUP_DIR=$PASTA_BACKUP
          EOF
          vps=(docker compose -p "$PROJETO-vps" -f docker-compose.vps.yml --env-file .env.vps)
          "${vps[@]}" up -d --build --wait
          base="http://127.0.0.1:$PORTA_WEB"
          curl -fsS "$base/api/saude" | grep '"status":"ok"'
          curl -fsS "$base/" | grep '<base href="/emptyvariable/"'
          curl -sS -o /dev/null -w '%{http_code}' "$base/api/auth/me" | grep 401
          # O login precisa voltar para a sub-rota, e o cookie de state ficar restrito a ela.
          curl -sS -o /dev/null -D - "$base/api/auth/discord" | grep -i 'set-cookie:.*Path=/emptyvariable/api/auth'
          "${vps[@]}" exec -T emptyvariable-backup sh /scripts/backup.sh
          "${vps[@]}" exec -T emptyvariable-backup sh /scripts/testar-restauracao.sh
      - name: Logs da stack da VPS em caso de falha
        if: failure()
        run: docker compose -p "$PROJETO-vps" -f docker-compose.vps.yml --env-file .env.vps logs --tail 200 || true
      - name: Derrubar a stack da VPS
        if: always()
        run: |
          vps=(docker compose -p "$PROJETO-vps" -f docker-compose.vps.yml --env-file .env.vps)
          "${vps[@]}" exec -T emptyvariable-backup sh -c 'rm -rf /backups/*' || true
          "${vps[@]}" down -v --rmi local --remove-orphans || true
          docker rm -f "$PROJETO-pg" > /dev/null 2>&1 || true
          docker network rm "$PROJETO-banco" > /dev/null 2>&1 || true
          docker compose -p "$PROJETO-dev" down --rmi local > /dev/null 2>&1 || true
          # As imagens do ambiente local não têm container, e o "down" não as remove: tira pelo nome.
          docker images --format '{{.Repository}}:{{.Tag}}' | grep "^$PROJETO-" | xargs -r docker rmi > /dev/null 2>&1 || true
