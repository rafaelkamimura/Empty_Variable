# Empty Variable numa sub-rota de um domínio que já tem outro sistema no nginx do host.
# Este arquivo é incluído DENTRO do bloco "server" (443) desse domínio; quem instala é o
# deploy/vps-nginx.sh, que troca /emptyvariable e a porta 4200 pelos valores do .env.
#
# A barra no fim do proxy_pass remove o prefixo: o contêiner web recebe "/" e "/api/...".
# Sem HSTS aqui: essa política vale para o domínio inteiro e é decisão do sistema dono dele.
location = /emptyvariable {
    return 301 /emptyvariable/;
}

# A API de integração (/api/integracao) é só para outros sistemas da mesma VPS, que chegam à API
# pela rede interna do Docker. Pela internet ela não existe, mesmo com o token certo.
location ^~ /emptyvariable/api/integracao {
    return 404;
}

# D61: o simulador de dano (web/public/simulador-latam) abre num iframe da tela /simulador, na mesma
# origem. Só ele pode ser emoldurado, e só por páginas deste domínio; o resto continua proibido.
# O simulador não pede nada a outro servidor, então a política dele não libera nenhuma origem externa.
location ^~ /emptyvariable/simulador-latam/ {
    proxy_pass http://127.0.0.1:4200/simulador-latam/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
}

location ^~ /emptyvariable/ {
    proxy_pass http://127.0.0.1:4200/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Mesma política do Caddyfile: Angular Material injeta estilos em tempo de execução;
    # fontes do Google e avatares do Discord são as únicas origens externas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.discordapp.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://discord.com" always;
}
