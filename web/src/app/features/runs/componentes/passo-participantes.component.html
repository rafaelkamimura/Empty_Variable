@for (p of participantes(); track $index; let i = $index) {
  <fieldset class="linha" [attr.data-participante]="i">
    <legend>Participante {{ i + 1 }}</legend>
    <ui-campo rotulo="Personagem">
      <select uiCampo (change)="alterar.emit({ i, parte: { personagemId: valor($event) || null } })">
        <option value="" [selected]="p.personagemId === null">Escolha</option>
        @for (j of jogadores(); track j.id) {
          <optgroup [label]="j.apelido">
            @for (pp of j.personagens; track pp.id) {
              @if (pp.ativo) {
                <option [value]="pp.id" [selected]="p.personagemId === pp.id">{{ pp.nome }}</option>
              }
            }
          </optgroup>
        }
      </select>
    </ui-campo>
    <ui-campo rotulo="Classe">
      <select uiCampo (change)="classe.emit({ i, classeId: valor($event) })">
        <option value="" [selected]="p.classeId === null" disabled>Escolha</option>
        @for (c of classes(); track c.id) {
          <option [value]="c.id" [selected]="p.classeId === c.id">
            {{ c.apelidoGrupo ?? c.nomeOficial }}
          </option>
        }
      </select>
    </ui-campo>
    <ui-campo rotulo="Função">
      <select
        uiCampo
        [disabled]="p.classeId === null"
        (change)="alterar.emit({ i, parte: { funcaoId: valor($event) || null } })"
      >
        <option value="" [selected]="p.funcaoId === null">Escolha</option>
        @for (f of funcoesDe(p); track f.id) {
          <option [value]="f.id" [selected]="p.funcaoId === f.id">{{ f.nome }} (rank {{ f.rank }})</option>
        }
      </select>
    </ui-campo>
    <ui-campo rotulo="Participação">
      <select uiCampo (change)="alterar.emit({ i, parte: { fracaoCentesimos: fracao(valor($event)) } })">
        @for (f of fracoes; track f) {
          <option [value]="f" [selected]="p.fracaoCentesimos === f">{{ rotuloFracao[f] }}</option>
        }
      </select>
    </ui-campo>
    <button
      uiBotao
      variante="fantasma"
      tamanho="p"
      (click)="remover.emit(i)"
      [attr.aria-label]="'Remover participante ' + (i + 1)"
    >
      Remover
    </button>
  </fieldset>
}
<button uiBotao (click)="adicionar.emit()">Adicionar participante</button>
