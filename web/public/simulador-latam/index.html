<html lang="pt-BR" class="ro-booting">
  <head>
    <meta charset="utf-8" />
    <title>Simulador de dano</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <style>
      html { font-size: 14px; }
      html.ro-booting,
      html.ro-booting body {
        overflow: hidden;
      }
      .ro-splash {
        position: fixed;
        inset: 0;
        /* Acima das sobreposições da interface durante a abertura. */
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #17212f;
        color: rgba(255, 255, 255, 0.87);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .ro-splash-ring {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #81c784;
        border-radius: 50%;
        animation: ro-splash-spin 0.9s linear infinite;
      }
      .ro-splash-text {
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        opacity: 0.75;
      }
      @keyframes ro-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Saída suave. A remoção do elemento é agendada por setTimeout, não por
         transitionend: numa aba em segundo plano o navegador não compõe quadros, a
         transição não roda e o evento nunca dispara — o splash ficaria preso. */
      .ro-splash.ro-splash--hide {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        .ro-splash-ring {
          animation-duration: 2.4s;
        }
        .ro-splash.ro-splash--hide {
          transition: none;
        }
      }
    </style>
    <link rel="preload" as="style" href="styles.HTWBAL4M.css"><link rel="stylesheet" data-ro-styles media="print" href="styles.HTWBAL4M.css">
    <link rel="preload" as="style" href="main.6BSPUZCS.css"><link rel="stylesheet" data-ro-styles media="print" href="main.6BSPUZCS.css">
    <link rel="stylesheet" href="ev.css">
    <link rel="modulepreload" href="main.ZWNOXSLO.js">
    <link rel="modulepreload" href="chunk-T3YF7RVB.js">
    <link rel="modulepreload" href="chunk-SQE76S5B.js">
    <link rel="modulepreload" href="chunk-BGWFJQWT.js">
  </head>
  <body>
    <div class="ro-splash" id="ro-splash">
      <div class="ro-splash-ring"></div>
      <div class="ro-splash-text">Carregando o simulador…</div>
    </div>
    <app-root></app-root>
    <script type="module" src="main.ZWNOXSLO.js"></script>
  </body>
</html>
